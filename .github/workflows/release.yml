name: Release
on:
  release:
    types:
      - published
jobs:
  register:
    name: Package, Publish, and Register
    runs-on:
      - ubuntu-latest
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v6

      - name: Docker login docker.io
        if: ${{ (github.event_name != 'pull_request' || ! github.event.pull_request.head.repo.fork) && (github.actor != 'dependabot[bot]') }}
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_PASSWORD }}
          registry: docker.io
          username: ${{ secrets.PAKETO_BUILDPACKS_DOCKERHUB_USERNAME }}

      - id: setup-pack
        uses: buildpacks/github-actions/setup-pack@v5.10.1

      - uses: buildpacks/github-actions/setup-tools@v5.10.1
        with:
          crane-version: 0.20.6
          yj-version: 5.1.0

      - id: package
        run: ./scripts/package.sh
        env:
          REPO: docker.io/paketobuildpacks/apt

      - id: register
        uses: docker://ghcr.io/buildpacks/actions/registry/request-add-entry:5.10.1
        with:
          token: ${{ secrets.PAKETO_BOT_GITHUB_TOKEN }}
          id: ${{ steps.package.outputs.bp_id }}
          version: ${{ steps.package.outputs.version }}
          address: ${{ steps.package.outputs.address }}
